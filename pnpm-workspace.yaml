packages: 
  - 'packages/*'
trustPolicy: no-downgrade
trustPolicyExclude:
  - "ua-parser-js" # later major versions have elevated trust
  - "semver" # later major versions have elevated trust
  - "@octokit/endpoint" # later major versions have elevated trust
blockExoticSubdeps: true
allowBuilds:
  core-js: true
  cpu-features: true
  es5-ext: true
  nx: true
  ssh2: true
